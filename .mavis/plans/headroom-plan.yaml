      ## 품질 기준 (매우 중요)
      - **§13 Notable Patterns 가 가장 중요**: ✅ (우리 가 차야 할 것) / 💡 (놀라운 것) / ❌ (피할 것) 각각 코드 인용 + 우리 적용 방안
      - **숫자 명시**: LOC, file 수, dep 수, commit 수 등
      - **사실/평가 분리**

      ## 특별 관심사 (headroom)
      1. **6 algorithms 의 실제 구현**:
         - CacheAligner (`headroom/transforms/cache_aligner.py`) — prefix 안정화로 provider KV cache hit
         - ContentRouter (`headroom/transforms/content_router.py`) — content type 감지 → 적절한 compressor 선택
         - CCR (Context Cache Reduction, `headroom/ccr/`) — reversible compression + 로컬 storage + `headroom_retrieve` tool
         - SmartCrusher (`headroom/transforms/smart_crusher.py`) — JSON 압축
         - CodeCompressor (`headroom/transforms/code_compressor.py`) — AST 기반 코드 압축
         - Kompress-base (`headroom/transforms/kompress_compressor.py`) — 자체 ML 모델 (HF chopratejas/kompress-base)
      2. **20+ transforms** (`headroom/transforms/`): adaptive_sizer, anchor_selector, code_compressor, cache_aligner, diff_compressor, error_detection, html_extractor, log_compressor, read_lifecycle, search_compressor, smart_crusher, tag_protector 등 각각의 역할
      3. **3가지 통합 모드**:
         - Library: `from headroom import compress` (Python) / `import { compress } from 'headroom-ai'` (TS)
         - Proxy: `headroom proxy --port 8787` (zero code change, any language)
         - MCP: headroom 자체 MCP server
      4. **Pipeline architecture** (`headroom/pipeline.py` + `headroom/transforms/pipeline.py`): detect → route → compress → emit 흐름
      5. **ML 모델 자체 호스팅** (`kompress_compressor.py` + `models/`): HuggingFace chopratejas/kompress-base 사용, ONNX runtime (`headroom/onnx_runtime.py`)
      6. **API key / model config**: `headroom/models/`, `headroom/providers/`, 환경변수 패턴
      7. **Tests 구조** (`tests/`): pytest, mock 전략 (LLM mocking), proxy backend tests, cache tests, parser tests 등
      8. **Kompress-base 의 학습 데이터 / 성능** (`Kompress-base` HuggingFace model card)
      9. **headroom 의 수익화 모델** (ENTERPRISE.md, PR.md): Apache 2.0 + 상용 서비스 분리?

      ## 절대 금지
