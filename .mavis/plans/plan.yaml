      7. `aider/commands.py` (있다면) — slash command 시스템
      8. `pyproject.toml` — dynamic dependency (setuptools_scm), optional-dependencies
      9. **확장성 부재 분석** 가 핵심 — aider 는 plugin/MCP/hooks 가 없는데 어떻게 이게 작동하는지, 우리한테 주는 시사점

