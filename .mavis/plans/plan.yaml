    verified_by: verifier
    verify_prompt: |
      `/Users/yklee/repos/harness-refs/aider` 의 코드를 직접 다시 읽고 다음을 재검증.

      1. **rich 라이브러리**: `aider/io.py` 의 `from rich.X import` 라인들 — Color/Columns/Console/Markdown/Style 가 실제로 import 되는지. 분석서가 인용한 import 가 실제 파일과 일치하는지.
      2. **repo.py 의 git 추상화**: `aider/repo.py` 의 `Repo` 클래스 — `add_file` / `get_tracked_files` / `get_dirty_files` 같은 메서드가 실제로 존재하는지. 분석서 §6 또는 §7 의 코드 발췌가 맞는지.
      3. **history.py 의 토큰 요약**: `aider/history.py` 의 `ChatSummary.summarize_real` — max_tokens=1024, min_split=4, depth>3 같은 로직이 실제 코드와 일치하는지.
      4. **CLI 진입점**: `pyproject.toml` 의 `[project.scripts]` — `aider = "aider.main:main"` 가 있는지. main.py 의 entry 함수가 `main` 인지.
      5. **확장성 부재**: aider 디렉토리에 `plugins/` / `hooks/` / `extensions/` 가 정말 없는지 (없으면 분석서가 "확장성 없음" 결론 맞음, 있으면 분석서 오류).

      추가로 14섹션 채움 / §13 구체성 / 코드 발췌 일치 / 1,500줄+ / 사실-평가 분리.

      결과: PASS / FAIL + 5개 주장 짝 비교.
    timeout_ms: 1800000

