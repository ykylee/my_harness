plan:
  name: '5-레퍼런스 코딩 에이전트 하네스 심층분석'
  max_concurrency: 5
  max_consecutive_failures: 2
  max_cycles: 3
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0
tasks:
  - id: analyze-opencode
    title: 'opencode (sst/opencode) 심층분석 — 14섹션 + Notable Patterns'
    prompt: |
      ## 작업
      `/Users/yklee/repos/harness-refs/opencode` 의 **실제 코드** 를 심층 분석해
      `/Users/yklee/repos/my_harness/docs/references/opencode.md` 에 14섹션 표준 마크다운 1개 작성.

      ## 표준 템플릿
      `/Users/yklee/repos/my_harness/docs/references/ANALYSIS_PLAN.md` §2.1 의 14섹션 + §2.2 의 opencode 특화 항목
      (packages/* 워크스페이스, Effect 라이브러리 사용 패턴, worker/server 분리) 전부 채움.
      해당 없으면 "N/A" + 1줄 사유.

      ## 출력 형식
      - 파일: `/Users/yklee/repos/my_harness/docs/references/opencode.md`
      - 표준 6필드 헤더 (ai-workflow/core/global_workflow_standard.md 준수)
      - 14 섹션 + §2.2 특화
      - 분량 1,500~3,000줄 (코드 인용 + 다이어그램 포함)
      - 코드 인용: ```언어 `path/to/file.ts:line` 형태, 5~20줄 발췌
      - ASCII 다이어그램 (아키텍처 / 데이터 흐름 / 플러그인 시스템 등)
      - 표 (디렉토리 트리 / 명령어 / 설정 키 등)

      ## 품질 기준 (매우 중요)
      이 분석은 **my_harness CLI/TUI 의 1차 참조 자료** 다. 사용자가 이 문서만 읽고도 판단할 수 있어야 함.
      - **Self-contained**: 소스 다시 보지 않아도 이해됨
      - **숫자/통계 명시**: LOC, 바이너리 크기, 의존성 개수 등 측정 가능 데이터
      - **§13 Notable Patterns** 가 가장 중요: ✅ (우리 가 차야 할 것) / 💡 (놀라운 것) / ❌ (피할 것) 각각 코드 인용 + 우리 적용 방안
      - **1차 분석 보완**: 기존 `docs/REFERENCES.md` §3.1 의 1-페이지를 **깊이 10배** 로
      - **사실/평가 분리**: 사실은 사실로, 평가는 §13 에서

      ## 특별 관심사 (opencode)
      1. `packages/opencode/src/cli/cmd/tui/` 디렉토리 구조 — TUI 진입점, render loop, attach/worker 패턴
      2. `packages/server/` — HTTP API, 미들웨어, 핸들러
      3. `packages/opencode/src/plugin/` — 플러그인 시스템 추상화
      4. `.opencode/` 의 7개 서브디렉토리 (agent/command/glossary/plugin/skill/theme/tool) 각각 어떤 포맷
      5. Effect 라이브러리 (`effect`, `effect-drizzle-sqlite`, `effect-sqlite-node`) 사용 패턴 — TUI 에서 어떻게 쓰는지
      6. journal.json / EventV2 / SessionID 스키마 — 세션 영속화
      7. Windows FFI (`win32.ts`) — 크로스플랫폼 전략
      8. `packages/opencode/src/cli/cmd/tui/event.ts` — TUI 가 정의한 이벤트들

      ## 절대 금지
      - Git push / commit (오너 작업)
      - CI / 리뷰 폴링
      - 다른 레퍼런스 분석
      - 시크릿/토큰 값 노출 (있으면 REDACTED)

      ## 보고
      작업 끝나면 `mavis communication send` 로 메인(mvs_51ad429f7aaf4fe1bbe25965e8788083) 에게:
      1. 작성한 파일 절대경로
      2. 분량 (줄 수)
      3. 가장 중요한 인사이트 3개
      4. 미해결 질문 (있다면)
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      `/Users/yklee/repos/harness-refs/opencode` 의 코드를 직접 다시 읽고 다음을 재검증.

      1. **TUI 라이브러리**: `packages/opencode/src/cli/cmd/tui/app.tsx` 의 import 라인 확인 — `@opentui/solid` + `@opentui/core` + `@opentui/keymap` 가 실제로 import 되는지. 분석서의 코드 인용이 실제 파일과 일치하는지.
      2. **TUI-Server 분리**: `packages/opencode/src/cli/cmd/tui/worker.ts` 가 별도 worker process 인지, server 와 어떻게 통신하는지 (RPC/HTTP). 분석서의 다이어그램이 실제 코드와 맞는지.
      3. **`.opencode/` 디렉토리**: 실제 디렉토리 ls — plugin/command/theme/tool/skill/agent/glossary 가 존재하는지. 분석서가 누락 없이 모두 다뤘는지.
      4. **AGENTS.md 컨벤션**: 루트 `AGENTS.md` 의 "Commits and PR Titles" 섹션 — conventional commits, type/scope 규칙이 분석서 §9 또는 §13 에 정확히 반영됐는지.
      5. **SessionID 스키마**: `packages/opencode/src/cli/cmd/tui/validate-session.ts` 의 SessionID 사용, `@/session/schema` 가 effect Schema 로 정의됐는지.

      추가로:
      - 14섹션 전부 채워졌는지 (§1~§14 빠짐없이, 빈 섹션 N/A 표시했는지)
      - §13 Notable Patterns 가 구체적인지 — 각 항목이 코드 인용 + 우리 적용 방안을 포함하는지, 추상적 조언만 있으면 FAIL
      - 코드 발췌가 실제 소스 파일과 1:1 일치하는지 (오타, 잘못된 라인 번호, 변형된 코드 → FAIL)
      - 분량이 1,500줄 이상인지 (너무 짧으면 분석 부족으로 FAIL)

      결과: PASS / FAIL + (재검증한 5개 주장에 대한 소스 인용 vs 분석서 인용 짝 비교)
    timeout_ms: 1800000

