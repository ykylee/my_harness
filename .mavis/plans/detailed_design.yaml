  - id: dd-5
    title: 'DD-5: DETAILED_DESIGN_RETRY.md — retry backoff + circuit breaker + exit code 표준'
    prompt: |
      [목표]
      docs/architecture/DETAILED_DESIGN_RETRY.md 작성 — 400~600 lines.
      TASK-005-1 의 myharness-llm + myharness-cli 구현 입력.

      [입력 SSOT]
      - docs/architecture/INITIAL_DESIGN.md §6.3 fallback chain + §3.8 myharness-llm (retry policy D-15)
      - docs/team/REVIEW.md §3.2 MINOR-7 (retry backoff jitter + circuit breaker) + MINOR-11 (exit code 0/1/2)
      - docs/CONCEPT.md §5.5.3 (dynamic fallback) + D-15 (3 fallback)

      [산출 구조 (6 sections)]
      1. §0 메타 + VERDICT
      2. §1 retry policy 의사코드 — backoff = base * 2^attempt + jitter(0~base/2), max 3 retry, exponential
      3. §2 circuit breaker 의사코드 — closed → open (3 consecutive error) → half-open (5min cool-down) → closed
      4. §3 exit code 표준 — 0=success / 1=user error (invalid args, permission denied, file not found) / 2=system error (subprocess failed, network, provider unavailable) / 3=internal error (bug)
      5. §4 error categorization (CONCEPT.md §5.5.3 D-15) — immediate surface (auth, rate_limit, request_size, transport) vs retry-able (overloaded, timeout, transient) vs non-retry (validation, format)
      6. §5 TC scaffold (L1 Unit TC 6 — retry/backoff/jitter/circuit-breaker/exit-code/categorization)
      7. §6 handoff

      [반드시 준수 — D-16 패턴]
      - chunked write 3 chunk
      - early signal docs/team/deliverable_dd5.md
      - minimal board noise

      [품질 바]
