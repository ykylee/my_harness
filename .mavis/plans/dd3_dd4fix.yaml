tasks:
  - id: dd-4-fix
    title: 'DD-4 fix: SP-02 force-push regex robust + 27 TC re-validate (verifier FAIL 해소)'
    prompt: |
      [목표]
      docs/specs/security-patterns.md 의 SP-02 (force push to main/master) regex 보강 + 27 TC scaffold (TC-SP-NN-P/N/E × 9) 모두 통과 검증.
      REVIEW.md §3.2 MINOR-5/15 + verifier feedback 직접 해소.

      [입력 SSOT]
      - docs/specs/security-patterns.md (메인, 857 lines, 6 sections)
      - docs/team/REVIEW.md §3.2 MINOR-5
      - docs/CONCEPT.md §5.4 (Hook system, claude-code 13.4 hookify)
      - docs/REQUIREMENTS.md NFR-SEC-1~8

      [verifier 가 발견한 결함]
      - 5-1. SP-02 force push regex 가 implementer perspective 에서 2/27 unit test fail 가능.
        - 현재 regex: `git push ... (-f|--force-with-lease) ... (main|master)` — `--force-with-lease` 만 잡고 short flag `-f` / flag 없는 변형 miss
        - 예시 fail case 1: `git push -f origin main` (short flag, no `--force-with-lease`)
        - 예시 fail case 2: `git push --force origin main` (long flag `--force` 만)
        - 예시 fail case 3: `git push --delete origin main` (다른 변형)
      - §0.6 self-check 의 "27/27 TC PASS" 가 현재 false.
      - §6.3 step 1 "5 spec doc (DD-1/2/3/4/5) suffice to write builtin_hooks.rs" 가 SP-02 fix 후에야 true.

      [산출 작업 (1 file 수정, 1 file 부분 수정)]
      1. §2.2 SP-02 regex 보강:
         - 현재: `git push ... (-f|--force-with-lease) ... (main|master)`
         - fix 권장: `git push\b[^\n]*?(?:-[A-Za-z]+[^\n]*?)*\b(?:--force(?:-(?:if-)?includes?|-with-lease(?:=[^\s]+)?)?|-f|--delete|--prune)\b[^\n]*?\b(?:main|master)\b`
         - 또는 동등한 robust regex: 모든 force variant (`-f`, `--force`, `--force-with-lease`, `--force-if-includes`, `--force-with-lease=ref`) + `--delete` + `--prune` cover
      2. §5.1 27 TC scaffold 의 SP-02 TC (3개) 재검증:
         - TC-SP-02-P (positive): `git push --force origin main` → match
         - TC-SP-02-P-alt: `git push -f origin master` → match
         - TC-SP-02-P-lease: `git push --force-with-lease=origin/main origin main` → match
         - TC-SP-02-N (negative): `git push origin feature-branch` → no match
         - TC-SP-02-N-trunk: `git push origin dev` (trunk 아닌 다른) → no match
         - TC-SP-02-E (edge): `GIT_PUSH_DEFAULT=simple git push --mirror origin main` → match (mirror 강제 push)
         - 실제 7+ TC (positive 3 / negative 2 / edge 2) 로 확장
      3. §0.6 self-check 표 27 → 30+ TC 정정
      4. §6.3 step 1 의 implementer checklist 보강 (SP-02 fix 후 true 명시)
      5. §6.7 implementer checklist 6 step 유지 (변경 ❌)

      [chunked write — D-16]
      - chunk 1: §2.2 SP-02 regex 수정 + §5.1 30+ TC scaffold (edit / append)
      - chunk 2: §0.6 + §6.3 step 1 (self-check 보강)
      - total 50~150 lines diff. 단일 Write 1,500줄+ ❌

      [early signal]
      - chunk 1 직후 docs/team/deliverable_dd4fix.md 작성 (status=in_progress + 1줄 summary)
      - 최종 docs/team/deliverable_dd4fix.md (status=done + VERDICT)

      [품질 바]
      - 모든 § 에 CONCEPT.md / REVIEW.md cross-ref 유지
      - 9 pattern (SP-01~SP-09) 정합 (SP-02 만 수정, 나머지 8 pattern 변경 ❌)
      - 27 → 30+ TC scaffold 정합 (positive/negative/edge 분포 명확)
      - D-16 chunked write 2 chunk + early signal + minimal board noise
      - 표준 6 원칙 (D-26): 한국어 / 결론 위주 / 상태값 done / 이벤트 소싱 / 비참조 / handoff
      - D-06 메커니즘만 (env var name 만, 실제 토큰 값 ❌)
      - 안티 6 미반영
      - 분량 diff 50~150 lines (전체 857 lines → ~907-1007 lines, over-shoot 600 target +50~67%, DD-1 +58% / DD-2 +60% precedent 정합)

      [산출물 경로]
      - docs/specs/security-patterns.md (수정, edit append)
      - docs/team/deliverable_dd4fix.md (early signal + final status)
      - /Users/yklee/.mavis/plans/<plan_id>/outputs/dd-4-fix/deliverable.md (engine)
    assigned_to: coder
    verified_by: verifier
    verify_prompt: |
      [독립 cross-check] verifier 가 발견한 SP-02 결함 + regex 보강 검증.

      체크리스트:
      1. SP-02 regex 가 implementer perspective 에서 robust:
         - `git push -f origin main` → match
         - `git push --force origin main` → match
         - `git push --force-with-lease=origin/main origin main` → match
         - `git push --force-if-includes origin main` → match
         - `git push origin feature-branch` → no match
         - `git push origin dev` → no match (trunk 아닌)
         - `git push --mirror origin main` → match
      2. 30+ TC scaffold 정합 (positive 3+ / negative 2+ / edge 2+ for SP-02)
      3. SP-01, SP-03~SP-09 regex 변경 ❌
      4. §0.6 self-check 표 정합
      5. §6.3 step 1 보강
      6. cross-ref 무결 (CONCEPT.md §5.4 + REVIEW.md §3.2 MINOR-5)
      7. D-16 chunked write 2 chunk + early signal
      8. 표준 6 원칙
      9. 분량 diff 50~150 lines
      10. D-06 / 안티 6 미반영
      PASS / FAIL + 각 항목 evidence + 7개 regex test case 결과.
    timeout_ms: 1800000

