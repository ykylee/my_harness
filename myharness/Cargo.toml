[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/llm",
    "crates/tui",
    "crates/tools",
    "crates/context",
    "crates/cli",
    "crates/auth",
    "crates/compression",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["yklee <yklee@example.com>"]
repository = "https://github.com/ykylee/my_harness"

[workspace.dependencies]
# LLM
rig-core = "0.38"
rmcp = { version = "1.7", features = ["server", "client", "transport-io"] }
# TUI
ratatui = "0.30"
crossterm = "0.29"
# Storage / Secret
keyring = "4"
tree-sitter = "0.26"
# Runtime
tokio = { version = "1", features = ["full"] }
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Errors
anyhow = "1"
thiserror = "2"
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Schema / Validation
schemars = "1.2"
# Misc
dirs = "6"
# Async / Time
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form"] }
# URL parsing (W16 add-local)
url = "2"
# Interactive CLI prompts (W16 add-local)
inquire = "0.9"
# Hashing (W21 hash8 + W23 tract ONNX model SHA256 verify)
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
