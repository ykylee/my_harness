[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/llm",
    "crates/tui",
    "crates/tools",
    "crates/context",
    "crates/cli",
    "crates/auth",
    "crates/compression",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
authors = ["yklee <yklee@example.com>"]
repository = "https://github.com/ykylee/my_harness"

[workspace.dependencies]
# LLM
rig-core = "0.38"
rmcp = { version = "1.7", features = ["server", "client", "transport-io"] }
# TUI
ratatui = "0.30"
crossterm = "0.29"
# Storage / Secret
keyring = "4"
tree-sitter = "0.26"
tree-sitter-rust = "0.23"
# Runtime
tokio = { version = "1", features = ["full"] }
# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# Errors
anyhow = "1"
thiserror = "2"
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Schema / Validation
schemars = "1.2"
# Misc
dirs = "6"
# Async / Time
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "form"] }
# URL parsing (W16 add-local)
url = "2"
# Interactive CLI prompts (W16 add-local)
inquire = "0.9"
# Hashing (W21 hash8 + W23 tract ONNX model SHA256 verify)
sha2 = "0.11"
# Storage (TASK-005-2 v2.0 Plugin Sub-task 1 Commit B — sqlite FTS5 + BM25)
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# --- D-119: workspace-level lints baseline ---
# Cargo 1.74+ [workspace.lints] (workspace.dependencies 와 동일하게 1 곳에서 정책 정의).
# 모두 `warn` 으로 시작 — 강한 `deny`/`forbid` 는 의도적 opt-in (TASK-005 v2.0 D-119).
# 8 crate 가 자동으로 상속 (각 crate Cargo.toml 에 [lints] 없을 때).
# baseline: 안전한 hygiene 가드. 새 warning 이 발견돼도 build/clippy/test 통과에 영향 없음.
[workspace.lints.rust]
unsafe_code = "warn"                # 모든 unsafe 사용 시 경고 (현재 다수: env::set_var/remove_var in tests)
missing_debug_implementations = "warn"  # pub struct 가 Debug 미구현 시 경고
rust_2018_idioms = "warn"          # `..Default::default()` 등 deprecated 패턴 경고

[workspace.lints.clippy]
module_name_repetitions = "warn"   # `foo::Foo` 같은 자명한 이름
needless_pass_by_value = "warn"    # `&T` 로 충분한데 `T` 로 받는 경우
redundant_closure_for_method_calls = "warn"  # `|x| x.method()` → `Method::method`
